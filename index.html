
<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>مسندم 2040</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial;
    }
    .welcome {
      position: fixed;
      top: 12px;
      left: 0;
      right: 0;
      z-index: 10;
      text-align: center;
      color: white;
      font-size: 20px;
      font-weight: bold;
      text-shadow: 1px 1px 4px black;
      pointer-events: none;
    }
  </style>
</head>

<body>

<div class="welcome">مسندم 2040 | مستقبل عُمان</div>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind;"
  color-space="sRGB"
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-entity mindar-image-target="targetIndex: 0">

    <!-- قاعدة المبنى -->
    <a-box
      position="0 0.02 0"
      width="0.8"
      height="0.04"
      depth="0.55"
      color="#625044">
    </a-box>

    <!-- جسم المبنى -->
    <a-box
      position="0 0.20 0"
      width="0.62"
      height="0.32"
      depth="0.40"
      color="#B58A55"
      opacity="0.95">
    </a-box>

    <!-- الواجهة الزجاجية -->
    <a-box
      position="0 0.20 0.205"
      width="0.48"
      height="0.25"
      depth="0.015"
      color="#83D8E8"
      opacity="0.65">
    </a-box>

    <!-- الجناح الأيمن للسقف -->
    <a-box
      position="0.19 0.43 0"
      width="0.48"
      height="0.035"
      depth="0.58"
      rotation="0 0 -18"
      color="#B87333">
    </a-box>

    <!-- الجناح الأيسر للسقف -->
    <a-box
      position="-0.19 0.43 0"
      width="0.48"
      height="0.035"
      depth="0.58"
      rotation="0 0 18"
      color="#CD985B">
    </a-box>

    <!-- أعمدة المبنى -->
    <a-cylinder position="-0.25 0.18 0.12"
      radius="0.018" height="0.32" color="#E0B878"></a-cylinder>

    <a-cylinder position="0.25 0.18 0.12"
      radius="0.018" height="0.32" color="#E0B878"></a-cylinder>

    <!-- عنوان المشروع -->
    <a-text
      value="MUSANDAM 2040"
      position="0 0.58 0.05"
      align="center"
      color="#FFFFFF"
      width="2">
    </a-text>

  </a-entity>

</a-scene>
</body>
</html>
